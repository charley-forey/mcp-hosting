# nginx server block for hosting a streamable HTTP MCP server.
# Use this when you run nginx directly (not via ingress-nginx), or as a
# reference for the equivalent annotations on ingress-nginx (see
# examples/helm/values.yaml -> ingress.annotations).

upstream mcp_backend {
    # The MCP server listens on TCP 8080 inside the pod / VM.
    server 127.0.0.1:8080;
    keepalive 32;
}

# Map the SEP-2243 routing header so it's available in logs and rules.
# https://modelcontextprotocol.io/seps/2243-http-standardization
map $http_mcp_method $mcp_method_log { default $http_mcp_method; "" "-"; }
map $http_mcp_name   $mcp_name_log   { default $http_mcp_name;   "" "-"; }

log_format mcp '$remote_addr [$time_local] "$request" '
               'mcp_method="$mcp_method_log" mcp_name="$mcp_name_log" '
               '$status $body_bytes_sent rt=$request_time';

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/ssl/certs/mcp.example.com.crt;
    ssl_certificate_key /etc/ssl/private/mcp.example.com.key;

    # TLS 1.3 only with strong ciphers.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

    # Defense-in-depth headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    access_log /var/log/nginx/mcp.access.log mcp;

    # Health endpoint, served directly by nginx (don't tax the MCP for liveness).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The MCP endpoint. Must support both POST (client -> server) and GET
    # (server-initiated SSE), plus DELETE (session termination).
    location /mcp {
        # ---- Streaming-safe upstream settings ------------------------------
        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_http_version         1.1;
        proxy_set_header           Connection "";

        # SSE streams are long-lived; do not cap them at the default 60s.
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        send_timeout               3600s;

        # Prevent intermediate compression of text/event-stream.
        proxy_set_header           Accept-Encoding "";

        # ---- Forward request context to the MCP server --------------------
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        # SEP-2243 routing headers pass through unchanged. nginx doesn't
        # need them for proxying but they're available here for routing
        # rules if you split traffic by method/name in future.

        # ---- Origin allowlist for DNS rebinding protection -----------------
        # Block requests with no Origin or an unexpected one. Update the
        # allowlist to match your trusted clients. The MCP server should
        # also enforce this, but defense in depth is cheap here.
        if ($http_origin !~* ^(https://chat\.example\.com|https://internal\.example\.com)$) {
            return 403;
        }

        proxy_pass http://mcp_backend;
    }
}
