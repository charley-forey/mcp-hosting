{{- if .Values.observability.metrics.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mcp.fullname" . }}
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "mcp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.metrics.serviceMonitor.interval }}
{{- end -}}
