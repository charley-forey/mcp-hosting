{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp.fullname" . }}
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.ingressFromNamespaceLabel }}
              {{ $k }}: {{ $v }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # All other egress (OAuth issuer, downstream APIs, etc.) — tighten this
    # to specific CIDRs in production.
    - {}
{{- end -}}
